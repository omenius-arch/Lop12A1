<title>Sơ đồ lớp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: bảng ở trên, hai dãy bàn đôi (6 hàng x 4 chỗ) cạnh nhau, danh sách "chưa xếp chỗ" bên phải; điện thoại thì xếp dọc. */
:root {
  --bg: #edf1ee;
  --surface: #ffffff;
  --desk: #dde5df;
  --ink: #14231d;
  --muted: #5b6b63;
  --line: #c4d0c8;
  --accent: #1e6b52;
  --accent-ink: #ffffff;
  --board: #1b3a2f;
  --chalk: #eef3ec;
  --hl: #f4c430;
  --hl-ink: #2b2200;
  --danger: #b3342b;
  --font-ui: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-hand: 'Patrick Hand', 'Segoe Print', ui-rounded, system-ui, sans-serif;
  --seat-h: 100px;
  --desk-gap: 14px;
  --sky1: #8ecde6; --sky2: #e6f4ee; --sun: #ffd866; --hill1: #86b9a1; --hill2: #4d8c75;
  --lake1: #2f9db5; --lake2: #12647e; --wood: #8c6e4c; --wood2: #5f4931; --stars-on: 0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1613; --surface: #1a2622; --desk: #233029; --ink: #e6eee9; --muted: #93a59b;
    --line: #33443b; --accent: #4fc39a; --accent-ink: #0b1a14; --board: #0a241b; --chalk: #dce8df;
    --hl: #e0b72e; --hl-ink: #241c00; --danger: #f0877e; color-scheme: dark;
    --sky1: #0a1230; --sky2: #2a3868; --sun: #e8edf7; --hill1: #1e3b48; --hill2: #12292f;
    --lake1: #1b4b6e; --lake2: #09213a; --wood: #54432f; --wood2: #30271c; --stars-on: 1;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1613; --surface: #1a2622; --desk: #233029; --ink: #e6eee9; --muted: #93a59b;
  --line: #33443b; --accent: #4fc39a; --accent-ink: #0b1a14; --board: #0a241b; --chalk: #dce8df;
  --hl: #e0b72e; --hl-ink: #241c00; --danger: #f0877e; color-scheme: dark;
  --sky1: #0a1230; --sky2: #2a3868; --sun: #e8edf7; --hill1: #1e3b48; --hill2: #12292f;
  --lake1: #1b4b6e; --lake2: #09213a; --wood: #54432f; --wood2: #30271c; --stars-on: 1;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1260px; margin: 0 auto; }

/* ---- header ---- */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin-bottom: 20px; }
.top h1 { font-family: var(--font-hand); font-weight: 400; font-size: 44px; line-height: 1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.stats { margin: 6px 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.dirty { display: inline-block; background: var(--hl); color: var(--hl-ink); padding: 1px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; margin-left: 6px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.search { position: relative; min-width: 0; }
.search input {
  width: 210px; max-width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); outline: none;
}
.search input::placeholder { color: var(--muted); }
.btn {
  height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:hover { border-color: var(--line); }
:is(.btn, input, [data-sid], .icon-btn):focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }

/* ---- main layout ---- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 20px; align-items: start; }

.board {
  background: var(--board); color: var(--chalk); border-radius: 8px 8px 4px 4px; padding: 14px 20px;
  font-family: var(--font-hand); font-size: 26px; letter-spacing: .12em; text-align: center; text-transform: uppercase;
  border-bottom: 6px solid color-mix(in srgb, var(--board) 55%, #c9b79c);
  margin-bottom: 22px;
}
.rows { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; }
.row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 6px; }
.row-head h2 { font-family: var(--font-hand); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.1; }
.row-head span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.grid {
  display: grid; grid-template-columns: 22px repeat(2, minmax(0, 1fr)) var(--desk-gap) repeat(2, minmax(0, 1fr));
  grid-auto-rows: var(--seat-h);
}
.rowno { grid-column: 1; display: flex; align-items: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.desk { background: var(--desk); border-radius: 10px; z-index: 0; }
.desk.l { grid-column: 2 / 4; }
.desk.r { grid-column: 5 / 7; }

.seat {
  position: relative; z-index: 1; margin: 5px; border-radius: 8px; padding: 8px 4px 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; cursor: grab;
}
.seat.c0 { grid-column: 2; } .seat.c1 { grid-column: 3; } .seat.c2 { grid-column: 5; } .seat.c3 { grid-column: 6; }
.seat.empty { background: transparent; border: 1.5px dashed color-mix(in srgb, var(--muted) 55%, transparent); cursor: default; justify-content: center; color: var(--muted); font-size: 11px; text-align: center; }
.seat.over { outline: 3px solid var(--hl); outline-offset: 1px; background-color: color-mix(in srgb, var(--hl) 22%, var(--surface)); }
.seat.empty.over { background-color: color-mix(in srgb, var(--hl) 28%, transparent); }
.seat .nm { font-size: 12px; font-weight: 500; line-height: 1.2; text-align: center; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }

.av {
  width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; overflow: hidden;
  color: #fff; font-weight: 600; font-size: 14px; letter-spacing: .02em; pointer-events: none; background-size: cover; background-position: center;
}
.dragging { opacity: .3; }
.dim { opacity: .28; }
.hit { outline: 3px solid var(--hl); outline-offset: 1px; }

/* ---- pool ---- */
.pool {
  position: sticky; top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  max-height: calc(100vh - 24px); overflow: auto; min-width: 0;
}
.pool.over { outline: 3px solid var(--hl); outline-offset: 1px; }
.pool h2 { margin: 0 0 2px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.pool h2 span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.pool p.hint { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
.chips { display: grid; gap: 6px; }
.chip {
  display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line);
  cursor: grab; min-width: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.chip .av { width: 32px; height: 32px; font-size: 12px; }
.chip .t { min-width: 0; }
.chip .t b { display: block; font-weight: 500; font-size: 13px; overflow-wrap: anywhere; }
.chip .t i { display: block; font-style: normal; color: var(--muted); font-size: 11px; }
.pool .none { margin: 0; padding: 14px 4px; color: var(--muted); font-size: 13px; text-align: center; }

.ghost {
  position: fixed; z-index: 100; pointer-events: none; left: 0; top: 0; background: var(--surface); border: 1px solid var(--accent);
  border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.28);
  font-weight: 500; font-size: 13px; max-width: 220px;
}
.ghost .av { width: 32px; height: 32px; font-size: 12px; }

/* ---- editor ---- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8, 16, 12, .55); display: grid; place-items: center; padding: 16px; }
.sheet {
  width: min(380px, 100%); background: var(--surface); border-radius: 14px; border: 1px solid var(--line); padding: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,.35); max-height: 100%; overflow: auto;
}
.sheet h3 { margin: 0 0 14px; font-family: var(--font-hand); font-weight: 400; font-size: 26px; line-height: 1.1; }
.who { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.who .av { width: 72px; height: 72px; font-size: 24px; }
.who .col { display: flex; flex-wrap: wrap; gap: 6px; }
.fld { display: block; margin-bottom: 12px; }
.fld span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.fld input { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); outline: none; }
.fld input:focus { border-color: var(--accent); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-top: 16px; }
.acts .grp { display: flex; flex-wrap: wrap; gap: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90;
  background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px);
}

/* ---- bungee ---- */
.bungee { position: fixed; inset: 0; z-index: 70; background: var(--sky1); overflow: hidden; }
.bungee canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bbar {
  position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.bbar .pill {
  display: flex; align-items: center; gap: 10px; min-width: 0; padding: 5px 6px 5px 12px; border-radius: 10px;
  background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line);
}
.btitle { font-family: var(--font-hand); font-size: 22px; line-height: 1.1; white-space: nowrap; }
#bstat { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bbar .btn { height: 32px; padding: 0 12px; }
.bresult {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(360px, calc(100% - 32px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px 18px; text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,.35); max-height: calc(100% - 32px); overflow: auto;
}
.bresult .eyebrow { margin: 0 0 12px; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.bresult .av { width: 96px; height: 96px; font-size: 32px; margin: 0 auto 10px; box-shadow: 0 0 0 4px var(--hl); }
.bresult h3 { font-family: var(--font-hand); font-weight: 400; font-size: 34px; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.bresult .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.picked { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 14px 0 0; }
.picked span { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
.bresult .acts { justify-content: center; }

/* ---- narrow screens ---- */
@media (max-width: 1020px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .pool { position: static; max-height: none; }
  .chips { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
}
@media (max-width: 760px) {
  :root { --desk-gap: 8px; }
  .rows { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .top h1 { font-size: 38px; }
  .seat { margin: 3px; padding: 7px 3px 5px; }
  .seat .nm { font-size: 11px; }
  .av { width: 36px; height: 36px; font-size: 13px; }
  .search { flex: 1 1 100%; } .search input { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .seat, .chip, .btn { transition: background-color .12s, border-color .12s, opacity .12s; }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Sơ đồ lớp</h1>
      <p class="stats" id="stats"></p>
    </div>
    <div class="tools">
      <label class="search"><span class="sr">Tìm bạn</span><input id="q" type="search" placeholder="Tìm bạn trong lớp" autocomplete="off"></label>
      <button class="btn" id="undo" type="button">Hoàn tác</button>
      <button class="btn" id="shuffle" type="button">Xếp ngẫu nhiên</button>
      <button class="btn" id="reset" type="button">Đặt lại</button>
      <button class="btn" id="bungee-open" type="button">Bungee</button>
      <button class="btn" id="add" type="button">Thêm bạn</button>
      <button class="btn primary" id="export" type="button">Xuất seats.js</button>
    </div>
  </header>

  <div class="layout">
    <section aria-label="Sơ đồ chỗ ngồi">
      <div class="board">Bảng</div>
      <div class="rows" id="rows"></div>
    </section>
    <aside class="pool" id="pool" aria-label="Bạn chưa có chỗ">
      <h2>Chưa xếp chỗ <span id="poolCount"></span></h2>
      <p class="hint">Kéo một bạn vào ô trống hoặc đè lên bạn khác để đổi chỗ. Kéo bạn ra khu này để gỡ khỏi sơ đồ. Chạm vào tên để sửa.</p>
      <div class="chips" id="chips"></div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <h3 id="edTitle">Sửa thông tin</h3>
    <div class="who">
      <div class="av" id="edAv"></div>
      <div class="col">
        <button class="btn" id="edPick" type="button">Đổi ảnh</button>
        <button class="btn" id="edClear" type="button">Bỏ ảnh</button>
        <input id="edFile" type="file" accept="image/*" hidden>
      </div>
    </div>
    <label class="fld"><span>Tên hiển thị</span><input id="edName" maxlength="40" autocomplete="off"></label>
    <label class="fld"><span>Ghi chú (không bắt buộc)</span><input id="edNote" maxlength="40" autocomplete="off" placeholder="Ví dụ: Lớp trưởng"></label>
    <div class="acts">
      <div class="grp">
        <button class="btn" id="edUnseat" type="button">Gỡ khỏi chỗ</button>
        <button class="btn danger" id="edDelete" type="button">Xóa bạn</button>
      </div>
      <div class="grp">
        <button class="btn" id="edCancel" type="button">Hủy</button>
        <button class="btn primary" id="edSave" type="button">Xong</button>
      </div>
    </div>
  </div>
</div>
<div class="bungee" id="bungee" hidden>
  <canvas id="bgc"></canvas>
  <div class="bbar">
    <div class="pill"><span class="btitle">Bungee bốc thăm</span><span id="bstat"></span></div>
    <div class="pill">
      <button class="btn" id="bskip" type="button">Tua nhanh</button>
      <button class="btn" id="bclose" type="button">Đóng</button>
    </div>
  </div>
  <div class="bresult" id="bres" hidden></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="seats.js"></script>

  var students, seats, history = [], editing = null, pendingAvatar, query = '';
  var dirty = false, fileAt = 0, published;

  function defaultSeats(list) {
    var s = [];
    for (var i = 0; i < TOTAL; i++) s.push(i < list.length ? list[i].id : null);
    return s;
  }
  function clean(d) {
    if (!d || !Array.isArray(d.students) || !Array.isArray(d.seats)) return null;
    var ids = {};
    d.students.forEach(function (s) { ids[s.id] = true; });
    var st = [];
    for (var i = 0; i < TOTAL; i++) st.push(ids[d.seats[i]] ? d.seats[i] : null);
    return { students: d.students, seats: st };
  }
  /* Bản "đã đăng": nội dung file seats.js nếu có, nếu không thì danh sách mặc định trong file này. */
  function publishedState() {
    var f = window.SEATING ? clean(window.SEATING) : null;
    return f || { students: DEFAULTS.slice(), seats: defaultSeats(DEFAULTS) };
  }
  /* Bản nháp trong trình duyệt chỉ được dùng khi nó dựa trên đúng phiên bản seats.js đang có.
     Khi seats.js mới hơn (vừa up lên GitHub), seats.js thắng. */
  function load() {
    fileAt = (window.SEATING && window.SEATING.savedAt) || 0;
    published = publishedState();
    var use = published;
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw), c = clean(d);
        if (c && (d.base || 0) === fileAt) { use = c; dirty = !!d.dirty; }
      }
    } catch (e) {}
    students = use.students; seats = use.seats.slice();
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ base: fileAt, dirty: dirty, students: students, seats: seats })); } catch (e) {}
  }

    var html = '';

        g += '<div class="desk l" style="grid-row:' + (r + 1) + '"></div><div class="desk r" style="grid-row:' + (r + 1) + '"></div>';
      }
      for (var r2 = 0; r2 < ROWS; r2++) for (var c = 0; c < COLS; c++) {
        var idx = d * PER_DAY + r2 * COLS + c, s = seats[idx] ? byId(seats[idx]) : null;
        var pos = 'style="grid-row:' + (r2 + 1) + '"';
        var label = 'Dãy ' + (d + 1) + ', hàng ' + (r2 + 1) + ', chỗ ' + (c + 1);
        if (s) {

          g += '<div class="seat c' + c + '" ' + pos + ' data-seat="' + idx + '" data-sid="' + s.id + '" tabindex="0" role="button" aria-label="' + esc(s.name + ' – ' + label) + '" title="' + esc(s.name + (s.note ? ' · ' + s.note : '')) + '">' + avatar(s) + '<div class="nm">' + esc(s.name) + '</div></div>';
        } else {

        }

      html += '<div><div class="row-head"><h2>Dãy ' + (d + 1) + '</h2><span>' + filled + '/' + PER_DAY + ' chỗ · hàng 1 gần bảng</span></div><div class="grid">' + g + '</div></div>';
    }
    $('rows').innerHTML = html;

    var seated = {}; seats.forEach(function (id) { if (id) seated[id] = true; });
    var pool = students.filter(function (s) { return !seated[s.id]; });
    $('chips').innerHTML = pool.length ? pool.map(function (s) {
      return '<div class="chip" data-sid="' + s.id + '" tabindex="0" role="button" aria-label="' + esc(s.name) + ', chưa có chỗ">' + avatar(s) + '<div class="t"><b>' + esc(s.name) + '</b>' + (s.note ? '<i>' + esc(s.note) + '</i>' : '') + '</div></div>';

    $('stats').innerHTML = '<b>' + students.length + '</b> bạn · <b>' + used + '/' + TOTAL + '</b> chỗ đã có người · <b>' + (TOTAL - used) + '</b> chỗ trống' + (dirty ? ' <span class="dirty">Có chỉnh sửa chưa xuất ra seats.js</span>' : '');

    $('edName').value = s ? s.name : '';

  function saveEditor() {

    var note = $('edNote').value.trim();
    snapshot();
    if (editing === 'new') {
      var id = 's' + Date.now().toString(36) + Math.floor(Math.random() * 99);
      students = students.concat([{ id: id, name: name, note: note, avatar: pendingAvatar }]);
    } else {

  $('edClear').addEventListener('click', function () { pendingAvatar = ''; paintEditorAvatar(); });

    var f = this.files && this.files[0]; this.value = '';

    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var n = 128, c = document.createElement('canvas'); c.width = c.height = n;
        var side = Math.min(img.width, img.height), sx = (img.width - side) / 2, sy = (img.height - side) / 2;

  $('edSave').addEventListener('click', saveEditor);
  $('edUnseat').addEventListener('click', function () {
    var i = seatOf(editing); if (i < 0) return;
    snapshot(); seats[i] = null; save(); closeEditor(); render();
  });
  $('edDelete').addEventListener('click', function () {
    var id = editing; snapshot();
    students = students.filter(function (s) { return s.id !== id; });
    seats = seats.map(function (x) { return x === id ? null : x; });
    save(); closeEditor(); render(); toast('Đã xóa. Bấm Hoàn tác nếu xóa nhầm');
  });
  $('scrim').addEventListener('pointerdown', function (e) { if (e.target === this) closeEditor(); });

  /* ---------- toolbar ---------- */
  $('undo').addEventListener('click', undo);
  $('add').addEventListener('click', function () { openEditor(null); });
  $('shuffle').addEventListener('click', function () {
    snapshot();
    var ids = students.map(function (s) { return s.id; });
    for (var i = ids.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = ids[i]; ids[i] = ids[j]; ids[j] = t; }
    seats = []; for (var k = 0; k < TOTAL; k++) seats.push(k < ids.length ? ids[k] : null);

  });
  $('reset').addEventListener('click', function () {
    snapshot(); students = published.students; seats = published.seats.slice(); dirty = false;
    persist(); render(); toast('Đã quay về bản trong seats.js. Bấm Hoàn tác nếu cần');
  });
  function exportFile() {
    var text = 'window.SEATING = ' + JSON.stringify({ savedAt: Date.now(), students: students, seats: seats }) + ';\n';
    var url = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
    var a = document.createElement('a');
    a.href = url; a.download = 'seats.js'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);

  }

  $('q').addEventListener('input', function () { query = this.value; applyFilter(); });

  var toastTimer = 0;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2800);
  }

  /* ---------- Bungee bốc thăm ----------
     Cả lớp nhảy bungee trên hồ. Người được chọn (bốc ngẫu nhiên đều nhau) là người đứt dây và rớt xuống nước đầu tiên.
     Thứ tự đứng, thời điểm nhảy, độ dài dây, nhịp nảy và những sợi dây "suýt đứt" đều ngẫu nhiên. */
  var picked = [], BG = null;

  function rnd() {

  }

    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function poolLeft() { return students.filter(function (s) { return picked.indexOf(s.id) < 0; }); }

  function openBungee() {
    var pool = poolLeft();
    if (!pool.length) { picked = []; pool = students.slice(); toast('Mọi bạn đều đã được chọn, bắt đầu vòng mới'); }
    if (!pool.length) return;
    $('bungee').hidden = false;
    document.documentElement.style.overflow = 'hidden';

  }
  function flash(id) {
    var el = document.querySelector('[data-sid="' + id + '"]');
    if (!el) return;
    el.classList.add('hit');
    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
    setTimeout(function () { el.classList.remove('hit'); }, 4500);

  function closeBungee() {

    document.documentElement.style.overflow = '';

  }

  function startRun(pool) {

    Promise.all(jumpers.map(function (j) {
      return new Promise(function (res) {
        if (!j.s.avatar) return res(null);

  }
  function stepFall(sdt) {
    var B = BG, f = B.fall;
    f.vy += B.g * sdt; f.y += f.vy * sdt; f.x += f.vx * sdt; f.rot += f.spin * sdt;
    if (f.y >= B.waterY - B.S * 0.3) {
      B.phase = 'splash'; B.splashT = 0;
      var k = B.H / 800;
      for (var i = 0; i < 40; i++) {
        var ang = rr(-2.6, -0.55), sp = rr(120, 420) * k;
        B.parts.push({ x: f.x + rr(-8, 8), y: B.waterY, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 1, r: rr(1.5, 3.5) });
      }
      B.rings.push({ x: f.x, r: 2, a: 0.9 }, { x: f.x, r: -14, a: 0.8 }, { x: f.x, r: -30, a: 0.7 });
    }
  }
  function stepSplash(sdt, dt) {
    var B = BG, f = B.fall;
    var target = B.waterY - B.S * 0.25 + Math.sin(B.t * 3) * 3;
    f.y += (target - f.y) * Math.min(1, sdt * 4);
    f.rot *= 1 - Math.min(1, sdt * 3);
    B.splashT += dt;
    if (B.splashT > 1.3 && !B.shown) { B.shown = true; B.phase = 'done'; $('bstat').textContent = ''; showResult(); }
  }
  function stepParticles(sdt) {
    var B = BG;
    B.parts = B.parts.filter(function (p) {
      p.vy += B.g * 0.9 * sdt; p.x += p.vx * sdt; p.y += p.vy * sdt; p.life -= sdt * 1.2; return p.life > 0;
    });
    B.rings = B.rings.filter(function (r) { r.r += 110 * sdt; r.a -= 0.7 * sdt; return r.a > 0; });
  }

  function ridge(c, W, H, base, amp, seed, color) {
    c.fillStyle = color; c.beginPath(); c.moveTo(0, H);
    for (var x = 0; x <= W + 16; x += 16) {
      c.lineTo(x, base - amp * (0.5 + 0.35 * Math.sin(x * 0.008 + seed) + 0.2 * Math.sin(x * 0.021 + seed * 2.3) + 0.1 * Math.sin(x * 0.05 + seed * 4)));
    }
    c.lineTo(W + 16, H); c.closePath(); c.fill();
  }

  function draw(now) {
    var B = BG, c = $('bgc').getContext('2d'), W = B.W, H = B.H, S = B.S, col = B.col, x;
    c.setTransform(B.dpr, 0, 0, B.dpr, 0, 0);
    var sky = c.createLinearGradient(0, 0, 0, B.waterY);
    sky.addColorStop(0, col.sky1); sky.addColorStop(1, col.sky2);
    c.fillStyle = sky; c.fillRect(0, 0, W, H);
    if (col.stars) {
      c.fillStyle = '#fff';
      B.stars.forEach(function (s) { c.globalAlpha = s[2]; c.fillRect(s[0] * W, s[1] * B.waterY * 0.6, 1.6, 1.6); });
      c.globalAlpha = 1;
    }
    c.fillStyle = col.sun; c.beginPath(); c.arc(W * 0.8, B.waterY * 0.3, 34, 0, 6.2832); c.fill();
    ridge(c, W, H, B.waterY - 70, 55, 1.3, col.hill1);
    ridge(c, W, H, B.waterY - 28, 38, 4.1, col.hill2);

    var lk = c.createLinearGradient(0, B.waterY, 0, H);
    lk.addColorStop(0, col.lake1); lk.addColorStop(1, col.lake2);
    c.fillStyle = lk; c.beginPath(); c.moveTo(0, H); c.lineTo(0, B.waterY);
    for (x = 0; x <= W + 10; x += 10) c.lineTo(x, B.waterY + Math.sin(x * 0.03 + now * 2) * 3);
    c.lineTo(W + 10, H); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1.5; c.beginPath();
    for (x = 0; x <= W + 10; x += 10) { var wy = B.waterY + 14 + Math.sin(x * 0.02 - now * 1.5) * 2.5; if (x === 0) c.moveTo(x, wy); else c.lineTo(x, wy); }
    c.stroke();

    c.fillStyle = col.wood2;
    for (x = 20; x < W; x += 90) c.fillRect(x, B.deckY, 6, 16);
    c.fillStyle = col.wood; c.fillRect(0, B.deckY, W, 9);
    c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(0, B.deckY + 9, W, 2);

    B.jumpers.forEach(function (j, i) {
      var cut = i === B.w && B.phase !== 'run';
      if (!cut && B.t <= j.t0) return;
      var warn = B.t >= j.warn && B.t <= j.wEnd;
      c.strokeStyle = warn && !cut ? '#e5483d' : 'hsl(' + j.hue + ' 65% 55%)';
      c.lineWidth = warn && !cut ? 2.6 : 1.6;
      c.beginPath(); c.moveTo(j.x, j.y0);
      if (cut) c.lineTo(j.x + Math.sin(now * 6) * 4, j.y0 + 26);
      else { var p = jPos(j, B.t), jit = warn ? (Math.random() - 0.5) * 2.5 : 0; c.lineTo(p.x + jit, p.y); }
      c.stroke();
    });
    B.jumpers.forEach(function (j, i) {
      if (i === B.w && B.phase !== 'run') return;
      var p = jPos(j, B.t);
      c.drawImage(B.sprites[i], p.x - S / 2, p.y - S / 2, S, S);
    });

    if (B.phase !== 'run') {
      var f = B.fall;
      c.save(); c.translate(f.x, f.y); c.rotate(f.rot); c.drawImage(B.sprites[B.w], -S / 2, -S / 2, S, S); c.restore();
      c.strokeStyle = col.hl; c.lineWidth = 3; c.globalAlpha = 0.65 + 0.35 * Math.sin(now * 8);
      c.beginPath(); c.arc(f.x, f.y, S / 2 + 5, 0, 6.2832); c.stroke(); c.globalAlpha = 1;
      var nm = B.jumpers[B.w].s.name; c.font = B.font;
      var tw = c.measureText(nm).width + 18, tx = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, f.x)), ty = Math.max(B.deckTop + 12, f.y - S / 2 - 22);
      c.fillStyle = col.hl; c.beginPath();
      if (c.roundRect) c.roundRect(tx - tw / 2, ty - 12, tw, 24, 12); else c.rect(tx - tw / 2, ty - 12, tw, 24);
      c.fill();
      c.fillStyle = col.hlInk; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(nm, tx, ty + 1);
    }

    B.rings.forEach(function (r) {
      if (r.r <= 0) return;
      c.strokeStyle = 'rgba(255,255,255,' + r.a + ')'; c.lineWidth = 2;
      c.beginPath(); c.ellipse(r.x, B.waterY + 4, r.r, r.r * 0.28, 0, 0, 6.2832); c.stroke();
    });
    B.parts.forEach(function (p) {
      c.fillStyle = 'rgba(255,255,255,' + (p.life * 0.9) + ')'; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.2832); c.fill();
    });
  }

  function showResult() {
    var B = BG, s = B.jumpers[B.w].s;
    picked.push(s.id);
    var left = poolLeft().length;
    var list = picked.map(function (id, i) { var p = byId(id); return p ? '<span>' + (i + 1) + '. ' + esc(p.name) + '</span>' : ''; }).join('');
    $('bres').innerHTML =
      '<p class="eyebrow">Rớt xuống hồ đầu tiên</p>' + avatar(s) + '<h3>' + esc(s.name) + '</h3>' +
      (s.note ? '<p class="sub">' + esc(s.note) + '</p>' : '') +
      '<div class="picked">' + list + '</div>' +
      '<div class="acts">' +
        (left ? '<button class="btn primary" type="button" data-b="next">Chọn tiếp (còn ' + left + ' bạn)</button>' : '') +
        '<button class="btn" type="button" data-b="again">Làm lại từ đầu</button>' +
        '<button class="btn" type="button" data-b="close">Đóng</button>' +
      '</div>';
    $('bres').hidden = false;
  }

  $('bres').addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-b]');
    if (!b || !BG) return;
    var act = b.getAttribute('data-b');
    if (act === 'close') { closeBungee(); return; }
    if (act === 'again') picked = [];
    startRun(poolLeft());
  });
  $('bungee-open').addEventListener('click', openBungee);
  $('bclose').addEventListener('click', function () { closeBungee(); });
  $('bskip').addEventListener('click', function () { if (BG && BG.phase === 'run') BG.fast = true; });
  window.addEventListener('resize', function () {
    if (!BG || $('bungee').hidden || !BG.W) return;
    layout();
    if (BG.fall) { BG.fall.y = Math.min(BG.fall.y, BG.waterY - BG.S * 0.25); BG.fall.x = Math.min(BG.fall.x, BG.W - 20); }
  });

  load(); render();
})();
</script>
